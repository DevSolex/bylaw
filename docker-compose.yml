services:
  app:
    build: .
    image: bylaw:latest
    ports:
      # Host port is configurable via BYLAW_PORT (default 8000).
      # Change it in .env when 8000 is busy: BYLAW_PORT=8080
      - "${BYLAW_PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      # Audit log persisted on the host; git-ignored
      - ./data:/app/data
    restart: unless-stopped
