# config/vaults.yaml — curated vault metadata
#
# PURPOSE
# -------
# Fields that no live API provides (risk scores, APY where unavailable, etc.)
# are maintained here by the project team. Every field has an `as_of` date.
#
# RISK SCORE METHODOLOGY (project heuristic — not a rating agency score)
# -----------------------------------------------------------------------
# Risk scores (1 = lowest, 5 = highest) are assigned by the Bylaw team using
# three factors:
#   1. Asset class:
#        Government/sovereign bills or bonds       -> base 1-2
#        Investment-grade corporate bonds          -> base 2-3
#        Private credit / illiquid instruments     -> base 3-5
#   2. Redemption speed:
#        Instant or same-day redemption            -> -0.5 (floor 1)
#        Multi-week or async redemption            -> +0.5 to +1
#   3. Chain/protocol maturity:
#        Battle-tested L1 with audited contract    -> no adjustment
#        Newer or unaudited protocol               -> +0.5
#
# These scores are illustrative heuristics for the allocation algorithm.
# They are NOT investment ratings, credit scores, or financial advice.
#
# SOURCE LABELS
# -------------
# live      : read from a live RPC or API at request time
# curated   : this file, with an as_of date
# simulated : synthetic demo data, never real

vaults:

  # ── IXS Permissionless Vault (live + curated mix) ──────────────────
  - id: ixs-rwa-bnb
    name: "IXS RWA Permissionless Vault"
    chain: "bsc"
    asset: "USDC"
    contract_address: "0xc975a3EeF2e49F8eDdEf585340C43f15300fCB82"

    # Live fields read from BNB RPC (paused, total_assets) — fall back to curated
    # Confirmed on-chain 2026-09-20:
    #   asset()          = 0x8ac76a51cc950d9822d68b83fe1ad97b32cd580d (USDC on BSC)
    #   asset.decimals() = 18  (BSC USDC uses 18 decimals)
    #   asset.symbol()   = "USDC"
    #   vault.symbol()   = "ixv1"
    #   totalAssets()    = 654.372320 USDC
    #   pricePerShare()  = 1.08859600 USDC/share (yield accrued since inception)

    # Indicative APY — NOT the vault's realised yield
    # Source: iShares SHYG (0-5yr High Yield Corporate Bond ETF) 30-day SEC yield
    # URL: https://www.ishares.com/us/products/258100/ishares-05-year-high-yield-corporate-bond-etf
    # As of: 2026-09-17  |  30-day SEC yield: 6.72%  |  12m trailing yield: 7.07%
    # Expense ratio: 0.30%  (drag on net return)
    # This figure is the underlying ETF yield used as an indicative benchmark.
    # It is NOT the return realised by the IXS vault. Archive reads are unavailable
    # on the public BSC RPC so trailing vault yield cannot be derived on-chain.
    # Label shown in UI: "indicative: underlying ETF yield, not realized by the vault"
    apy: 0.0672
    apy_label: "indicative: underlying ETF yield, not realized by the vault"
    apy_note: "iShares SHYG 30-day SEC yield 6.72% as of 2026-09-17. 12m trailing: 7.07%, expense ratio: 0.30%. Source: https://www.ishares.com/us/products/258100"
    apy_as_of: "2026-09-17"

    redemption_days: 5
    redemption_note: "async ERC-7540; ~3-7 business day estimate (assumption — see findings.md)"
    settlement: "async"
    risk: 4
    risk_note: "private RWA credit, async redemption, BSC protocol; project heuristic"
    paused: false
    available_liquidity_usdc: null

    as_of: "2026-09-20"
    data_sources:
      paused: "live"
      available_liquidity_usdc: "live"
      apy: "curated"
      redemption_days: "curated"
      risk: "curated"

